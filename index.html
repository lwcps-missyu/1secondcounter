<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小學生 1 秒感體驗器 (廣東話 - 分鐘轉化版)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f8ff;
      margin: 0;
    }

    h1 { color: #333; margin-bottom: 10px; }

    /* 數字顯示卡片區塊 */
    .card {
      background-color: #ffffff;
      padding: 30px 50px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      transition: all 0.3s ease;
      min-width: 280px;
    }

    /* 60秒倍數時顯示的耀眼主題樣式 */
    .card.minute-reached {
      background-color: #fef3c7;
      border: 4px solid #f59e0b;
      transform: scale(1.05);
    }

    #number-display {
      font-size: 8rem;
      font-weight: bold;
      color: #2563eb;
      margin: 10px 0;
      line-height: 1;
      transition: color 0.3s ease;
    }

    /* 達到整分鐘時數字顏色改變 */
    .card.minute-reached #number-display {
      color: #d97706;
    }

    #cantonese-text {
      font-size: 2rem;
      color: #4b5563;
      height: 40px;
      margin-bottom: 10px;
    }

    /* 分鐘成就提示橫幅 */
    #minute-badge {
      display: none;
      background-color: #f59e0b;
      color: white;
      font-size: 1.25rem;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 50px;
      margin-top: 10px;
      animation: popIn 0.4s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .btn-container {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    button {
      font-size: 1.25rem;
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: transform 0.1s, background-color 0.2s;
    }
    button:active { transform: scale(0.95); }

    button#start-btn { background-color: #16a34a; }
    button#start-btn:hover { background-color: #15803d; }

    button#stop-btn { background-color: #dc2626; }
    button#stop-btn:hover { background-color: #b91c1c; }
  </style>
</head>
<body>

  <h1>⏱️ 1 秒感順數體驗 (廣東話)</h1>

  <div id="display-card" class="card">
    <!-- 阿拉伯數字顯示區域 -->
    <div id="number-display">0</div>
    
    <!-- 廣東話口訣提示區域 -->
    <div id="cantonese-text">準備</div>

    <!-- 每滿 60 秒彈出的提示標籤 -->
    <div id="minute-badge">🎉 恭喜！</div>
  </div>

  <div class="btn-container">
    <button id="start-btn" onclick="startCount()">開始數數</button>
    <button id="stop-btn" onclick="stopCount()">停止</button>
  </div>

  <script>
    let count = 0;
    let timerId = null;
    let cantoneseVoice = null;
    let audioCtx = null;

    // 1. 初始化 Web Audio Context
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 2. 載入廣東話 (zh-HK) 語音包
    function loadVoices() {
      if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        cantoneseVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
                         voices.find(v => v.lang.includes('HK')) || null;
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 3. 阿拉伯數字轉廣東話口訣 (1 -> 一零零一)
    function formatCountToCantoneseText(num) {
      const targetNum = 1000 + num;
      const digits = targetNum.toString().split('');
      const charMap = {
        '0': '零', '1': '一', '2': '二', '3': '三', '4': '四',
        '5': '五', '6': '六', '7': '七', '8': '八', '9': '九'
      };
      return digits.map(d => charMap[d]).join('');
    }

    // 4. 精準 1 秒提示音 (Beep)
    function playBeep() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    // 5. 穩定廣東話發音控制
    function speakCantoneseStable(text) {
      if (!('speechSynthesis' in window)) return;

      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-HK';
      if (cantoneseVoice) utterance.voice = cantoneseVoice;

      utterance.rate = 1.45;
      utterance.pitch = 1.0;

      window.speechSynthesis.speak(utterance);
    }

    // 6. 啟動計時器
    function startCount() {
      if (timerId !== null) return;

      initAudioContext();
      count = 0;
      resetTheme();

      runTick();

      timerId = setInterval(() => {
        runTick();
      }, 1000);
    }

    // 7. 每秒執行的邏輯 (核心判斷)
    function runTick() {
      count++;
      const cantoneseText = formatCountToCantoneseText(count);

      // 更新阿拉伯數字與口訣
      document.getElementById('number-display').textContent = count;
      document.getElementById('cantonese-text').textContent = cantoneseText;

      // 檢查是否達到 60 秒的倍數 (60, 120, 180...)
      checkMinuteMilestone(count);

      playBeep();
      speakCantoneseStable(cantoneseText);
    }

    // 8. 判斷並切換 60 秒倍數主題
    function checkMinuteMilestone(seconds) {
      const card = document.getElementById('display-card');
      const badge = document.getElementById('minute-badge');

      // 使用餘數運算 % 判斷是否被 60 整除且大於 0
      if (seconds > 0 && seconds % 60 === 0) {
        const minutes = seconds / 60; // 計算分鐘數
        
        // 變換卡片背景顏色主題
        card.classList.add('minute-reached');

        // 顯示動態文字標籤 (例: 1分鐘 = 60秒, 2分鐘 = 120秒)
        badge.textContent = `🎉 恭喜！${minutes} 分鐘 = ${seconds} 秒！`;
        badge.style.display = 'inline-block';
      } else {
        // 非 60 秒倍數時，恢復一般狀態
        card.classList.remove('minute-reached');
        badge.style.display = 'none';
      }
    }

    // 重置主題狀態
    function resetTheme() {
      const card = document.getElementById('display-card');
      const badge = document.getElementById('minute-badge');
      card.classList.remove('minute-reached');
      badge.style.display = 'none';
    }

    // 9. 停止計時器 (畫面保留當刻數字)
    function stopCount() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }
  </script>
</body>
</html>
