<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小學生 1 秒感體驗器 (廣東話高穩定版)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f8ff;
      margin: 0;
    }
    h1 { color: #333; margin-bottom: 10px; }
    
    #number-display {
      font-size: 8rem;
      font-weight: bold;
      color: #2563eb;
      margin: 10px 0;
      height: 160px;
      line-height: 160px;
      text-align: center;
    }

    #cantonese-text {
      font-size: 2rem;
      color: #4b5563;
      height: 40px;
      margin-bottom: 20px;
    }

    .btn-container {
      display: flex;
      gap: 15px;
    }

    button {
      font-size: 1.25rem;
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: transform 0.1s, background-color 0.2s;
    }
    button:active { transform: scale(0.95); }

    button#start-btn { background-color: #16a34a; }
    button#start-btn:hover { background-color: #15803d; }

    button#stop-btn { background-color: #dc2626; }
    button#stop-btn:hover { background-color: #b91c1c; }
  </style>
</head>
<body>

  <h1>⏱️ 1 秒感順數體驗 (廣東話)</h1>
  
  <!-- 阿拉伯數字顯示區域 -->
  <div id="number-display">0</div>
  
  <!-- 廣東話口訣提示區域 -->
  <div id="cantonese-text">準備</div>

  <div class="btn-container">
    <button id="start-btn" onclick="startCount()">開始數數</button>
    <button id="stop-btn" onclick="stopCount()">停止</button>
  </div>

  <script>
    let count = 0;
    let timerId = null;
    let cantoneseVoice = null;
    let audioCtx = null;

    // 1. 初始化 Web Audio Context (確保聲效即時)
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 2. 精準載入廣東話 (zh-HK) 語音包
    function loadVoices() {
      if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        // 優先挑選 zh-HK 廣東話語音包
        cantoneseVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
                         voices.find(v => v.lang.includes('HK')) || null;
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 3. 阿拉伯數字轉廣東話口訣 (1 -> 一零零一)
    function formatCountToCantoneseText(num) {
      const targetNum = 1000 + num; // 1 -> 1001
      const digits = targetNum.toString().split('');
      const charMap = {
        '0': '零', '1': '一', '2': '二', '3': '三', '4': '四',
        '5': '五', '6': '六', '7': '七', '8': '八', '9': '九'
      };
      return digits.map(d => charMap[d]).join('');
    }

    // 4. 精準 1 秒聲音提示音 (Beep)
    function playBeep() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime); // 800Hz 叮聲
      
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime); // 輕聲音量
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    // 5. 高穩定度廣東話發音控制
    function speakCantoneseStable(text) {
      if (!('speechSynthesis' in window)) return;

      // 防止 Chrome TTS 卡死解凍
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }

      // 清理未完成隊列，防止聲音堆積
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-HK';
      
      if (cantoneseVoice) {
        utterance.voice = cantoneseVoice;
      }

      // 語速設定為 1.3，確保「一零零一」4字能在 0.6 秒內念完，給語音引擎充足緩衝
      utterance.rate = 1.3;
      utterance.pitch = 1.0;

      window.speechSynthesis.speak(utterance);
    }

    // 6. 啟動計時器
    function startCount() {
      if (timerId !== null) return; // 避免重複啟動

      initAudioContext();
      count = 0;

      // 觸發第一次
      runTick();

      // 每剛好 1000 毫秒觸發一次
      timerId = setInterval(() => {
        runTick();
      }, 1000);
    }

    function runTick() {
      count++;
      const cantoneseText = formatCountToCantoneseText(count);

      // 更新阿拉伯數字與口訣
      document.getElementById('number-display').textContent = count;
      document.getElementById('cantonese-text').textContent = cantoneseText;

      // 播放輕微對齊音 + 廣東話
      playBeep();
      speakCantoneseStable(cantoneseText);
    }

    // 7. 停止計時器 (畫面保留當刻數字)
    function stopCount() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }
  </script>
</body>
</html>
