<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小學生 1 秒感體驗器 (廣東話 60秒提示版)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f0f8ff;
      margin: 0;
    }

    h1 { color: #333; margin-bottom: 10px; }

    /* 預設數字樣式：藍色 */
    #number-display {
      font-size: 8rem;
      font-weight: bold;
      color: #2563eb;
      margin: 10px 0;
      height: 160px;
      line-height: 160px;
      text-align: center;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    /* 當達到 60 秒或以上的提示樣式：亮紅色 + 放大效果 */
    #number-display.minute-reached {
      color: #dc2626;
      text-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
      transform: scale(1.08);
    }

    /* 廣東話口訣提示區域 */
    #cantonese-text {
      font-size: 2rem;
      color: #4b5563;
      height: 40px;
      margin-bottom: 5px;
    }

    /* 60 秒提示文字區域 */
    #minute-badge {
      font-size: 1.25rem;
      font-weight: bold;
      color: #dc2626;
      height: 30px;
      margin-bottom: 15px;
      visibility: hidden; /* 預設隱藏 */
    }

    #minute-badge.show {
      visibility: visible;
    }

    .btn-container {
      display: flex;
      gap: 15px;
    }

    button {
      font-size: 1.25rem;
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: transform 0.1s, background-color 0.2s;
    }
    button:active { transform: scale(0.95); }

    button#start-btn { background-color: #16a34a; }
    button#start-btn:hover { background-color: #15803d; }

    button#stop-btn { background-color: #dc2626; }
    button#stop-btn:hover { background-color: #b91c1c; }
  </style>
</head>
<body>

  <h1>⏱️ 1 秒感順數體驗 (廣東話)</h1>
  
  <!-- 阿拉伯數字顯示區域 -->
  <div id="number-display">0</div>
  
  <!-- 廣東話口訣提示區域 -->
  <div id="cantonese-text">準備</div>

  <!-- 1分鐘提示訊息標籤 -->
  <div id="minute-badge">🎉 60秒 = 1分鐘！已過1分鐘囉！</div>

  <div class="btn-container">
    <button id="start-btn" onclick="startCount()">開始數數</button>
    <button id="stop-btn" onclick="stopCount()">停止</button>
  </div>

  <script>
    let count = 0;
    let timerId = null;
    let cantoneseVoice = null;
    let audioCtx = null;

    // 1. 初始化 Web Audio Context
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 2. 載入廣東話 (zh-HK) 語音包
    function loadVoices() {
      if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        cantoneseVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
                         voices.find(v => v.lang.includes('HK')) || null;
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 3. 阿拉伯數字轉廣東話口訣 (1 -> 一零零一)
    function formatCountToCantoneseText(num) {
      const targetNum = 1000 + num; // 1 -> 1001
      const digits = targetNum.toString().split('');
      const charMap = {
        '0': '零', '1': '一', '2': '二', '3': '三', '4': '四',
        '5': '五', '6': '六', '7': '七', '8': '八', '9': '九'
      };
      return digits.map(d => charMap[d]).join('');
    }

    // 4. 精準 1 秒聲音提示音 (Beep)
    function playBeep() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    // 5. 穩定廣東話語音發音
    function speakCantoneseStable(text) {
      if (!('speechSynthesis' in window)) return;

      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-HK';
      
      if (cantoneseVoice) {
        utterance.voice = cantoneseVoice;
      }

      utterance.rate = 1.3; // 確保 4 個音節在 0.6 秒內完成
      utterance.pitch = 1.0;

      window.speechSynthesis.speak(utterance);
    }

    // 6. 啟動計時器
    function startCount() {
      if (timerId !== null) return;

      initAudioContext();
      count = 0;

      // 清除之前的 60 秒視覺提示樣式
      resetDisplayStyle();

      runTick();

      timerId = setInterval(() => {
        runTick();
      }, 1000);
    }

    // 7. 每秒的核心處理邏輯
    function runTick() {
      count++;
      const cantoneseText = formatCountToCantoneseText(count);

      const numDisplay = document.getElementById('number-display');
      const badgeDisplay = document.getElementById('minute-badge');

      // 更新阿拉伯數字與口訣
      numDisplay.textContent = count;
      document.getElementById('cantonese-text').textContent = cantoneseText;

      // 檢查是否達到 60 秒或以上
      if (count >= 60) {
        numDisplay.classList.add('minute-reached'); // 改變數字顏色為紅色
        badgeDisplay.classList.add('show');          // 顯示 1 分鐘提示語
      }

      // 播放輕微對齊音 + 廣東話
      playBeep();
      speakCantoneseStable(cantoneseText);
    }

    // 8. 重置數字樣式與提示
    function resetDisplayStyle() {
      const numDisplay = document.getElementById('number-display');
      const badgeDisplay = document.getElementById('minute-badge');
      numDisplay.classList.remove('minute-reached');
      badgeDisplay.classList.remove('show');
    }

    // 9. 停止計時器 (保留當前數字與顏色樣式)
    function stopCount() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }
  </script>
</body>
</html>
