<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小學生 1 秒感體驗器 (廣東話 - 分鐘關卡版)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f0f8ff;
      margin: 0;
      transition: background-color 0.5s ease;
    }

    h1 {
      color: #1e293b;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #64748b;
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* 數字顯示卡片 (預設藍色主題) */
    .card {
      background-color: #ffffff;
      padding: 20px 40px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 280px;
      transition: all 0.5s ease;
      border: 4px solid #3b82f6;
    }

    /* 滿整分鐘時的卡片主題 (耀眼黃金色) */
    .card.minute-reached {
      background-color: #fef3c7;
      border-color: #f59e0b;
      transform: scale(1.05);
      box-shadow: 0 20px 30px -10px rgba(245, 158, 11, 0.3);
    }

    #number-display {
      font-size: 8rem;
      font-weight: 800;
      color: #2563eb;
      margin: 0;
      line-height: 1;
      transition: color 0.5s ease;
    }

    /* 滿整分鐘時的數字顏色 */
    .minute-reached #number-display {
      color: #d97706;
    }

    #cantonese-text {
      font-size: 2rem;
      color: #475569;
      margin-top: 15px;
      font-weight: 600;
    }

    /* 分鐘提示徽章 */
    #minute-badge {
      display: none;
      margin-top: 15px;
      padding: 8px 16px;
      background-color: #f59e0b;
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 50px;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    .btn-container {
      margin-top: 30px;
      display: flex;
      gap: 15px;
    }

    button {
      font-size: 1.25rem;
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: transform 0.1s, background-color 0.2s;
    }
    button:active { transform: scale(0.95); }

    button#start-btn { background-color: #16a34a; }
    button#start-btn:hover { background-color: #15803d; }

    button#stop-btn { background-color: #dc2626; }
    button#stop-btn:hover { background-color: #b91c1c; }
  </style>
</head>
<body>

  <h1>⏱️ 1 秒感順數體驗 (廣東話)</h1>
  <p class="subtitle">建立「1 秒」與「1 分鐘 = 60 秒」的時間概念</p>
  
  <div class="card" id="display-card">
    <!-- 阿拉伯數字 -->
    <div id="number-display">0</div>
    
    <!-- 廣東話口訣 -->
    <div id="cantonese-text">準備</div>

    <!-- 滿分鐘動態提示徽章 -->
    <div id="minute-badge">🎉 1 分鐘 = 60 秒！</div>
  </div>

  <div class="btn-container">
    <button id="start-btn" onclick="startCount()">開始數數</button>
    <button id="stop-btn" onclick="stopCount()">停止鎖定</button>
  </div>

  <script>
    let count = 0;
    let timerId = null;
    let cantoneseVoice = null;
    let audioCtx = null;

    // 初始化 Web Audio Context
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 載入廣東話語音包
    function loadVoices() {
      if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        cantoneseVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
                         voices.find(v => v.lang.includes('HK')) || null;
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 將數字轉為廣東話四字口訣 (1 -> 一零零一)
    function formatCountToCantoneseText(num) {
      const targetNum = 1000 + num; 
      const digits = targetNum.toString().split('');
      const charMap = {
        '0': '零', '1': '一', '2': '二', '3': '三', '4': '四',
        '5': '五', '6': '六', '7': '七', '8': '八', '9': '九'
      };
      return digits.map(d => charMap[d]).join('');
    }

    // 播放提示音 (Beep)
    function playBeep(isMinuteMark = false) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      // 滿整分鐘時用更高的音調 (1200Hz)，平時為 (800Hz)
      const freq = isMinuteMark ? 1200 : 800;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // 高穩定度廣東話語音發聲
    function speakCantoneseStable(text) {
      if (!('speechSynthesis' in window)) return;

      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-HK';
      
      if (cantoneseVoice) {
        utterance.voice = cantoneseVoice;
      }

      utterance.rate = 1.45; // 保持 1.45 語速避免隊列卡死
      window.speechSynthesis.speak(utterance);
    }

    // 啟動計時器
    function startCount() {
      if (timerId !== null) return;

      initAudioContext();
      count = 0;
      resetTheme(); // 啟動時重置主題

      runTick();

      timerId = setInterval(() => {
        runTick();
      }, 1000);
    }

    // 每秒運算核心邏輯
    function runTick() {
      count++;
      const cantoneseText = formatCountToCantoneseText(count);

      // 更新阿拉伯數字與口訣
      document.getElementById('number-display').textContent = count;
      document.getElementById('cantonese-text').textContent = cantoneseText;

      const card = document.getElementById('display-card');
      const badge = document.getElementById('minute-badge');

      // 🔍 檢查是否恰好到達整分鐘 (60, 120, 180...)
      if (count > 0 && count % 60 === 0) {
        const minutes = count / 60; // 計算這是第幾分鐘
        
        // 1. 切換為整分鐘金黃色主題
        card.classList.add('minute-reached');

        // 2. 更新並顯示提示徽章
        badge.textContent = `🎉 ${minutes} 分鐘 = ${count} 秒！`;
        badge.style.display = 'block';

        // 3. 播放滿分鐘專屬高音叮聲
        playBeep(true);
      } else {
        // 非整分鐘時，恢復一般狀態
        card.classList.remove('minute-reached');
        badge.style.display = 'none';
        
        // 播放一般節拍叮聲
        playBeep(false);
      }

      // 朗讀廣東話口訣
      speakCantoneseStable(cantoneseText);
    }

    // 重置主題樣式
    function resetTheme() {
      const card = document.getElementById('display-card');
      const badge = document.getElementById('minute-badge');
      card.classList.remove('minute-reached');
      badge.style.display = 'none';
    }

    // 停止計時 (畫面保持當刻數字與分鐘狀態)
    function stopCount() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }
  </script>
</body>
</html>
