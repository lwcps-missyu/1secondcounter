<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廣東話 1 秒感體驗器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8 md:p-12 max-w-md w-full text-center flex flex-col items-center">
    
    <!-- Title Section -->
    <div class="mb-6">
      <span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 font-semibold rounded-full text-sm mb-2">
        ⏱️ 數學科學習工具
      </span>
      <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">1 秒感順數體驗</h1>
      <p class="text-slate-500 text-sm mt-1">聽讀「一零零X」口訣，建立精準 1 秒時間感</p>
    </div>

    <!-- Number Display Section -->
    <div class="w-full bg-slate-100 rounded-2xl py-10 my-4 flex flex-col items-center justify-center border-2 border-slate-200/60 shadow-inner min-h-[220px]">
      <div id="number-display" class="text-8xl md:text-9xl font-black text-indigo-600 tracking-tight transition-all duration-150 transform scale-100">
        0
      </div>
      <div id="status-badge" class="mt-2 text-xs font-bold uppercase tracking-wider text-slate-400 bg-slate-200 px-3 py-1 rounded-full">
        準備就緒
      </div>
    </div>

    <!-- Speech Display Subtitle -->
    <div id="speech-preview" class="text-slate-600 font-medium h-8 flex items-center justify-center mb-6 text-lg">
      口訣發音：<span id="speech-text" class="text-indigo-600 font-bold ml-1">——</span>
    </div>

    <!-- Control Buttons -->
    <div class="grid grid-cols-2 gap-4 w-full">
      <button id="start-btn" onclick="startCount()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-emerald-500/20 transition-all duration-150 transform active:scale-95 text-lg flex items-center justify-center gap-2">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>
        </svg>
        開始
      </button>

      <button id="stop-btn" onclick="stopCount()" class="w-full bg-rose-500 hover:bg-rose-600 active:bg-rose-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-rose-500/20 transition-all duration-150 transform active:scale-95 text-lg flex items-center justify-center gap-2">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"></path>
        </svg>
        停止
      </button>
    </div>

  </div>

  <script>
    let count = 0;
    let timerId = null;

    /**
     * 將阿拉伯數字轉換為廣東話漢字口訣
     * 範例: 1 -> "一零零一", 12 -> "一零一二"
     */
    function formatCountToCantoneseText(num) {
      const targetNum = 1000 + num; // 例如 1 -> 1001
      const digits = targetNum.toString().split('');
      const charMap = {
        '0': '零',
        '1': '一',
        '2': '二',
        '3': '三',
        '4': '四',
        '5': '五',
        '6': '六',
        '7': '七',
        '8': '八',
        '9': '九'
      };

      // 逐字轉換，確保發音為「一零零一」而非「一千零一」
      return digits.map(d => charMap[d]).join('');
    }

    /**
     * 啟動計時器 (每秒 1000ms 觸發一次)
     */
    function startCount() {
      if (timerId !== null) return; // 避免重複啟動

      count = 0;
      updateUI(count, "計時中...", true);

      // 設定精準 1000 毫秒（1 秒）循環
      timerId = setInterval(() => {
        count++;
        const cantoneseText = formatCountToCantoneseText(count);

        // 1. 畫面顯示阿拉伯數字 (1, 2, 3...)
        updateDisplayNumber(count);
        
        // 2. 更新口訣文字提示
        document.getElementById('speech-text').textContent = cantoneseText;

        // 3. 播放廣東話口訣語音
        speakCantonese(cantoneseText);
      }, 1000);
    }

    /**
     * 停止計時器
     */
    function stopCount() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      
      // 停止語音播放
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      // 更新 UI 狀態，但保留畫面上當前的阿拉伯數字
      updateUIStatus("已停止", false);
    }

    /**
     * 更新畫面的阿拉伯數字
     */
    function updateDisplayNumber(num) {
      const displayElem = document.getElementById('number-display');
      displayElem.textContent = num;

      // 增加微小縮放動畫，增強計數視覺反饋
      displayElem.classList.remove('scale-100');
      displayElem.classList.add('scale-110');
      setTimeout(() => {
        displayElem.classList.remove('scale-110');
        displayElem.classList.add('scale-100');
      }, 150);
    }

    /**
     * 更新 UI 狀態與提示標籤
     */
    function updateUI(num, statusText, isRunning) {
      updateDisplayNumber(num);
      updateUIStatus(statusText, isRunning);
      if (!isRunning && num === 0) {
        document.getElementById('speech-text').textContent = "——";
      }
    }

    function updateUIStatus(statusText, isRunning) {
      const badge = document.getElementById('status-badge');
      badge.textContent = statusText;
      
      if (isRunning) {
        badge.className = "mt-2 text-xs font-bold uppercase tracking-wider text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full animate-pulse";
      } else {
        badge.className = "mt-2 text-xs font-bold uppercase tracking-wider text-slate-500 bg-slate-200 px-3 py-1 rounded-full";
      }
    }

    /**
     * 使用 Web Speech API 播放廣東話語音
     */
    function speakCantonese(text) {
      if ('speechSynthesis' in window) {
        // 先停止之前的語音，確保 1 秒節奏乾淨俐落
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK'; // 設定為廣東話 (香港)
        utterance.rate = 1.35;    // 適當調快語速，確保 4 個字能在 1 秒內清楚唸完
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
