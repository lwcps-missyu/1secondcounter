<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廣東話 1 秒感體驗器與測試</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .font-num { font-family: 'Fredoka', 'Noto Sans TC', sans-serif; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
    .beat-pulse { animation: pulse-ring 0.35s ease-out; }
  </style>
</head>
<body class="bg-amber-50/60 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 text-slate-800">

  <main class="bg-white rounded-3xl shadow-2xl border-4 border-amber-200 p-6 sm:p-10 max-w-lg w-full text-center flex flex-col items-center relative overflow-hidden">
    
    <!-- Header Banner -->
    <div class="mb-3">
      <span class="inline-flex items-center gap-1.5 px-4 py-1.5 bg-amber-100 text-amber-900 font-bold rounded-full text-sm mb-2 border border-amber-300 shadow-sm">
        <span class="animate-bounce">⏱️</span> 廣東話 1 秒感學習與測試
      </span>
      <h1 class="text-3xl sm:text-4xl font-black text-slate-800 tracking-tight">建立精準 1 秒感</h1>
      <p class="text-slate-500 text-sm mt-1 font-medium">口訣「一零零一、一零零二」練習節奏</p>
    </div>

    <!-- MAIN DISPLAY BOX -->
    <div id="display-card" class="w-full bg-gradient-to-b from-indigo-50 to-amber-50/50 rounded-3xl py-6 px-4 my-2 flex flex-col items-center justify-center border-4 border-indigo-100 shadow-inner min-h-[200px] relative transition-all duration-200">
      <div id="beat-indicator" class="absolute top-4 right-4 w-4 h-4 rounded-full bg-slate-300 transition-colors duration-150"></div>

      <!-- Arabic Number Display -->
      <div id="number-display" class="font-num text-7xl sm:text-8xl font-black text-indigo-600 tracking-tight drop-shadow-md select-none transition-transform duration-100">
        0
      </div>

      <!-- Cantonese Mantra Subtitle -->
      <div class="mt-2 text-xl sm:text-2xl font-extrabold text-amber-600 h-10 flex items-center justify-center tracking-widest bg-white/80 px-6 py-1 rounded-full border border-amber-200 shadow-sm">
        <span id="cantonese-text">準備就緒</span>
      </div>
    </div>

    <!-- TEST RESULT DISPLAY BOX (預設隱藏) -->
    <div id="test-result-card" class="hidden w-full bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-4 my-2 text-center shadow-sm">
      <div id="result-badge" class="inline-block px-3 py-1 bg-emerald-600 text-white font-extrabold text-xs rounded-full mb-1">
        🎯 測試結果
      </div>
      <div id="result-title" class="text-xl font-black text-emerald-900 my-1">
        極度精準！
      </div>
      <div id="result-detail" class="text-xs sm:text-sm font-bold text-slate-700 space-y-1 mt-2 bg-white/80 p-2.5 rounded-xl border border-emerald-200">
        <!-- 由 JS 動態注入結果細節 -->
      </div>
    </div>

    <!-- STATUS BADGE -->
    <div class="my-2">
      <span id="status-badge" class="px-4 py-1.5 rounded-full text-sm font-bold bg-slate-100 text-slate-500 border border-slate-200 shadow-sm">
        尚未開始
      </span>
    </div>

    <!-- CONTROLS & TEST SETTINGS -->
    <div class="w-full space-y-3 mt-2">
      
      <!-- TARGET SECONDS TEST PANEL -->
      <div class="bg-amber-100/50 p-3.5 rounded-2xl border border-amber-200 text-left space-y-2">
        <div class="flex items-center justify-between">
          <span class="font-extrabold text-slate-800 text-xs sm:text-sm flex items-center gap-1">
            🎯 自訂目標秒數測試
          </span>
          <label class="flex items-center gap-1.5 cursor-pointer text-xs font-bold text-slate-600 select-none">
            <input type="checkbox" id="blind-toggle" class="w-4 h-4 text-amber-600 accent-amber-600 rounded">
            <span>🙈 盲測模式（隱藏提示）</span>
          </label>
        </div>

        <div class="flex items-center gap-2">
          <input type="number" id="target-seconds-input" min="1" max="60" value="5" class="w-20 px-3 py-1.5 border-2 border-amber-300 rounded-xl text-center font-extrabold text-amber-900 focus:outline-none focus:border-amber-500 bg-white">
          <span class="text-xs font-bold text-slate-600">秒</span>

          <div class="flex gap-1 ml-auto">
            <button onclick="setQuickTarget(3)" class="px-2.5 py-1 bg-white hover:bg-amber-200/60 border border-amber-300 rounded-lg text-xs font-bold transition-colors">3秒</button>
            <button onclick="setQuickTarget(5)" class="px-2.5 py-1 bg-white hover:bg-amber-200/60 border border-amber-300 rounded-lg text-xs font-bold transition-colors">5秒</button>
            <button onclick="setQuickTarget(10)" class="px-2.5 py-1 bg-white hover:bg-amber-200/60 border border-amber-300 rounded-lg text-xs font-bold transition-colors">10秒</button>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="grid grid-cols-2 gap-3">
        <button id="start-btn" onclick="startCounting()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-extrabold py-3.5 px-4 rounded-2xl shadow-lg shadow-emerald-500/30 border-b-4 border-emerald-700 transition-all active:translate-y-1 active:border-b-0 text-lg flex items-center justify-center gap-2">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>
          </svg>
          開始數數
        </button>

        <button id="stop-btn" onclick="stopCounting()" class="w-full bg-rose-500 hover:bg-rose-600 active:bg-rose-700 text-white font-extrabold py-3.5 px-4 rounded-2xl shadow-lg shadow-rose-500/30 border-b-4 border-rose-700 transition-all active:translate-y-1 active:border-b-0 text-lg flex items-center justify-center gap-2">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"></path>
          </svg>
          停止鎖定
        </button>
      </div>

      <!-- Sound Settings Toggle -->
      <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-200 flex items-center justify-between px-4 text-xs font-bold text-slate-600">
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="checkbox" id="beep-toggle" checked class="w-4 h-4 text-amber-500 accent-amber-500 rounded">
          <span>🔔 1秒拍子聲 (Beep)</span>
        </label>
        
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="checkbox" id="speech-toggle" checked class="w-4 h-4 text-indigo-600 accent-indigo-600 rounded">
          <span>🗣️ 廣東話語音</span>
        </label>
      </div>

    </div>

  </main>

  <script>
    let count = 0;
    let timerId = null;
    let audioCtx = null;
    let cantoneseVoice = null;
    let expectedTickTime = 0; 
    let startTimestamp = 0; // 精準計算測驗毫秒數的起始時間戳記

    /**
     * 快速設定目標秒數按鈕
     */
    function setQuickTarget(sec) {
      document.getElementById('target-seconds-input').value = sec;
    }

    /**
     * 取得 AudioContext (支援 iPad/iOS)
     */
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      return audioCtx;
    }

    /**
     * iPadOS 解鎖音訊通道
     */
    function unlockIosAudio() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
      const buffer = ctx.createBuffer(1, 1, 22050);
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      source.start(0);
    }

    /**
     * 載入廣東話語音
     */
    function loadVoices() {
      if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        cantoneseVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
                         voices.find(v => v.lang.includes('HK') || v.lang.includes('yue')) ||
                         voices.find(v => v.lang.includes('zh')) || null;
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    /**
     * 數字轉廣東話口訣 (例如: 1 -> 一零零一)
     */
    function formatToCantoneseMantra(num) {
      const targetNum = 1000 + num;
      const digits = targetNum.toString().split('');
      const charMap = {
        '0': '零', '1': '一', '2': '二', '3': '三', '4': '四',
        '5': '五', '6': '六', '7': '七', '8': '八', '9': '九'
      };
      return digits.map(d => charMap[d]).join('');
    }

    /**
     * 播放 Beep 聲
     */
    function playPrecisionBeep() {
      const ctx = getAudioContext();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    }

    /**
     * 廣東話語音合成
     */
    function speakCantoneseWord(text) {
      if (!('speechSynthesis' in window)) return;
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-HK';
      if (cantoneseVoice) utterance.voice = cantoneseVoice;
      utterance.rate = 1.3;
      utterance.pitch = 1.0;

      window.speechSynthesis.speak(utterance);
    }

    /**
     * 核心每秒 Tick 邏輯
     */
    function tick() {
      count++;
      const isBlind = document.getElementById('blind-toggle').checked;
      const mantraText = formatToCantoneseMantra(count);

      const numElem = document.getElementById('number-display');
      const textElem = document.getElementById('cantonese-text');
      const beatInd = document.getElementById('beat-indicator');

      // 1. UI 顯示 (若為盲測模式則遮蔽畫面)
      if (isBlind) {
        numElem.textContent = '🙈';
        textElem.textContent = '盲測進行中...';
      } else {
        numElem.textContent = count;
        textElem.textContent = mantraText;
      }

      numElem.classList.remove('beat-pulse');
      void numElem.offsetWidth; 
      numElem.classList.add('beat-pulse');

      beatInd.className = "absolute top-4 right-4 w-4 h-4 rounded-full bg-emerald-500 shadow-md shadow-emerald-500/50";
      setTimeout(() => {
        beatInd.className = "absolute top-4 right-4 w-4 h-4 rounded-full bg-slate-300 transition-colors duration-200";
      }, 200);

      // 2. 聲音播放 (若開啟盲測，暫停嗶聲與語音以考驗體感)
      if (!isBlind) {
        if (document.getElementById('beep-toggle').checked) {
          playPrecisionBeep();
        }
        if (document.getElementById('speech-toggle').checked) {
          speakCantoneseWord(mantraText);
        }
      }
    }

    /**
     * 自適應動態計時迴圈
     */
    function step() {
      tick();
      expectedTickTime += 1000;
      const drift = Date.now() - expectedTickTime;
      const nextDelay = Math.max(0, 1000 - drift);
      timerId = setTimeout(step, nextDelay);
    }

    /**
     * 開始數數 / 測試
     */
    function startCounting() {
      if (timerId !== null) return;

      unlockIosAudio();

      if ('speechSynthesis' in window) {
        const warmup = new SpeechSynthesisUtterance('');
        warmup.volume = 0;
        window.speechSynthesis.speak(warmup);
      }

      // 隱藏上一次的測試結果
      document.getElementById('test-result-card').classList.add('hidden');

      count = 0;
      startTimestamp = performance.now(); // 記錄高精準起始毫秒

      const isBlind = document.getElementById('blind-toggle').checked;
      document.getElementById('number-display').textContent = isBlind ? '🙈' : '0';
      document.getElementById('cantonese-text').textContent = isBlind ? '盲測進行中...' : '一零零零';

      const targetSec = parseFloat(document.getElementById('target-seconds-input').value) || 5;
      const badge = document.getElementById('status-badge');
      badge.textContent = `🎯 目標 ${targetSec} 秒測試中...`;
      badge.className = "px-4 py-1.5 rounded-full text-sm font-bold bg-emerald-100 text-emerald-800 border border-emerald-300 animate-pulse shadow-sm";

      expectedTickTime = Date.now();
      timerId = setTimeout(step, 1000);
    }

    /**
     * 停止鎖定並計算測試結果
     */
    function stopCounting() {
      if (timerId !== null) {
        clearTimeout(timerId);
        timerId = null;
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      // 計算精確毫秒時間與評分
      const stopTimestamp = performance.now();
      const actualElapsedSec = (stopTimestamp - startTimestamp) / 1000;
      const targetSec = parseFloat(document.getElementById('target-seconds-input').value) || 5;

      if (count > 0 || actualElapsedSec > 0.3) {
        showTestResult(targetSec, actualElapsedSec);
      } else {
        const badge = document.getElementById('status-badge');
        badge.textContent = "尚未開始";
        badge.className = "px-4 py-1.5 rounded-full text-sm font-bold bg-slate-100 text-slate-500 border border-slate-200 shadow-sm";
      }
    }

    /**
     * 分析並顯示測試結果評分
     */
    function showTestResult(targetSec, actualSec) {
      const diffSec = actualSec - targetSec;
      const absDiffMs = Math.abs(diffSec) * 1000;
      
      const resultCard = document.getElementById('test-result-card');
      const resultTitle = document.getElementById('result-title');
      const resultDetail = document.getElementById('result-detail');
      const badge = document.getElementById('status-badge');

      let ratingTitle = "";
      let cardBgClass = "";

      // 根據誤差等級發放評分
      if (absDiffMs <= 250) {
        ratingTitle = "🏆 人體原子鐘！極度精準！";
        cardBgClass = "bg-emerald-50 border-emerald-300";
      } else if (absDiffMs <= 600) {
        ratingTitle = "🎯 非常準確！非常有節奏感！";
        cardBgClass = "bg-indigo-50 border-indigo-300";
      } else if (absDiffMs <= 1200) {
        ratingTitle = "👍 良好體感！稍微有小誤差。";
        cardBgClass = "bg-amber-50 border-amber-300";
      } else {
        ratingTitle = "😅 差了一點點，繼續練習吧！";
        cardBgClass = "bg-rose-50 border-rose-300";
      }

      resultCard.className = `w-full border-2 rounded-2xl p-4 my-2 text-center shadow-sm ${cardBgClass}`;
      resultTitle.textContent = ratingTitle;

      const signStr = diffSec >= 0 ? `+${diffSec.toFixed(2)}` : `${diffSec.toFixed(2)}`;
      
      resultDetail.innerHTML = `
        <div class="flex justify-between border-b pb-1 border-slate-200">
          <span>🎯 目標秒數：<strong>${targetSec.toFixed(2)} 秒</strong></span>
          <span>⏱️ 實際秒數：<strong>${actualSec.toFixed(2)} 秒</strong></span>
        </div>
        <div class="pt-1 text-slate-800">
          誤差時間：<span class="${absDiffMs <= 300 ? 'text-emerald-600' : 'text-rose-600'} font-extrabold">${signStr} 秒</span> 
          (${(absDiffMs).toFixed(0)} 毫秒)
        </div>
      `;

      resultCard.classList.remove('hidden');

      badge.textContent = `⏸ 已完成 ${targetSec} 秒測試`;
      badge.className = "px-4 py-1.5 rounded-full text-sm font-bold bg-amber-100 text-amber-800 border border-amber-300 shadow-sm";
    }
  </script>
</body>
</html>
