<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廣東話 1 秒感體驗器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }
    .font-num {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
    .beat-pulse {
      animation: pulse-ring 0.35s ease-out;
    }
  </style>
</head>
<body class="bg-amber-50/60 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 text-slate-800">

  <main class="bg-white rounded-3xl shadow-2xl border-4 border-amber-200 p-6 sm:p-10 max-w-lg w-full text-center flex flex-col items-center relative overflow-hidden">
    
    <!-- Header Banner -->
    <div class="mb-4">
      <span class="inline-flex items-center gap-1.5 px-4 py-1.5 bg-amber-100 text-amber-900 font-bold rounded-full text-sm sm:text-base mb-2 border border-amber-300 shadow-sm">
        <span class="animate-bounce">⏱️</span> 廣東話 1 秒感學習工具
      </span>
      <h1 class="text-3xl sm:text-4xl font-black text-slate-800 tracking-tight">建立精準 1 秒感</h1>
      <p class="text-slate-500 text-sm sm:text-base mt-1 font-medium">聽讀口訣「一零零一、一零零二」練習節奏</p>
    </div>

    <!-- MAIN DISPLAY BOX -->
    <div id="display-card" class="w-full bg-gradient-to-b from-indigo-50 to-amber-50/50 rounded-3xl py-8 px-4 my-2 flex flex-col items-center justify-center border-4 border-indigo-100 shadow-inner min-h-[240px] relative transition-all duration-200">
      
      <!-- Beat visual feedback indicator -->
      <div id="beat-indicator" class="absolute top-4 right-4 w-4 h-4 rounded-full bg-slate-300 transition-colors duration-150"></div>

      <!-- Arabic Number Display -->
      <div id="number-display" class="font-num text-8xl sm:text-9xl font-black text-indigo-600 tracking-tight drop-shadow-md select-none transition-transform duration-100">
        0
      </div>

      <!-- Cantonese Mantra Subtitle -->
      <div class="mt-2 text-2xl sm:text-3xl font-extrabold text-amber-600 h-10 flex items-center justify-center tracking-widest bg-white/80 px-6 py-1 rounded-full border border-amber-200 shadow-sm">
        <span id="cantonese-text">準備就緒</span>
      </div>
    </div>

    <!-- STATUS BADGE -->
    <div class="my-3">
      <span id="status-badge" class="px-4 py-1.5 rounded-full text-sm font-bold bg-slate-100 text-slate-500 border border-slate-200 shadow-sm">
        尚未開始
      </span>
    </div>

    <!-- CONTROLS & AUDIO SETTINGS -->
    <div class="w-full space-y-4 mt-2">
      
      <!-- Action Buttons -->
      <div class="grid grid-cols-2 gap-4">
        <button id="start-btn" onclick="startCounting()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-extrabold py-4 px-6 rounded-2xl shadow-lg shadow-emerald-500/30 border-b-4 border-emerald-700 transition-all active:translate-y-1 active:border-b-0 text-xl flex items-center justify-center gap-2">
          <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>
          </svg>
          開始數數
        </button>

        <button id="stop-btn" onclick="stopCounting()" class="w-full bg-rose-500 hover:bg-rose-600 active:bg-rose-700 text-white font-extrabold py-4 px-6 rounded-2xl shadow-lg shadow-rose-500/30 border-b-4 border-rose-700 transition-all active:translate-y-1 active:border-b-0 text-xl flex items-center justify-center gap-2">
          <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"></path>
          </svg>
          停止鎖定
        </button>
      </div>

      <!-- Sound Settings Toggle -->
      <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center justify-between px-4 text-xs sm:text-sm font-bold text-slate-600">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="beep-toggle" checked class="w-4 h-4 text-amber-500 accent-amber-500 rounded focus:ring-amber-400">
          <span>🔔 1秒精準拍子聲 (Beep)</span>
        </label>
        
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="speech-toggle" checked class="w-4 h-4 text-indigo-600 accent-indigo-600 rounded focus:ring-indigo-400">
          <span>🗣️️ 廣東話語音</span>
        </label>
      </div>

    </div>

  </main>

  <script>
    let count = 0;
    let timerId = null;
    let audioCtx = null;
    let cantoneseVoice = null;
    let expectedTickTime = 0; 

    /**
     * 取得或初始化 AudioContext (支援 iOS/iPadOS 探測)
     */
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      return audioCtx;
    }

    /**
     * 針對 iPadOS / iOS 解鎖音訊通道的核心函數
     * 必須在使用者的直接點擊（User Gesture）事件中觸發
     */
    function unlockIosAudio() {
      const ctx = getAudioContext();
      
      if (ctx.state === 'suspended') {
        ctx.resume();
      }

      // 播放長度極短的空白 Buffer 緩衝區來徹底強迫 iPadOS 釋放音訊頻道
      const buffer = ctx.createBuffer(1, 1, 22050);
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      source.start(0);
    }

    /**
     * 載入瀏覽器中的廣東話語音包
     */
    function loadVoices() {
      if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        cantoneseVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
                         voices.find(v => v.lang.includes('HK') || v.lang.includes('yue')) ||
                         voices.find(v => v.lang.includes('zh')) || null;
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    /**
     * 將數字轉換為廣東話口訣 (例如: 1 -> "一零零一")
     */
    function formatToCantoneseMantra(num) {
      const targetNum = 1000 + num;
      const digits = targetNum.toString().split('');
      const charMap = {
        '0': '零', '1': '一', '2': '二', '3': '三', '4': '四',
        '5': '五', '6': '六', '7': '七', '8': '八', '9': '九'
      };
      return digits.map(d => charMap[d]).join('');
    }

    /**
     * 播放精準拍子聲 (Beep)
     */
    function playPrecisionBeep() {
      const ctx = getAudioContext();
      if (!ctx) return;

      // 如果狀態仍被掛起，再次嘗試恢復
      if (ctx.state === 'suspended') {
        ctx.resume();
      }

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);

      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    }

    /**
     * 廣東話語音合成發音
     */
    function speakCantoneseWord(text) {
      if (!('speechSynthesis' in window)) return;

      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-HK';

      if (cantoneseVoice) {
        utterance.voice = cantoneseVoice;
      }

      utterance.rate = 1.3;
      utterance.pitch = 1.0;

      window.speechSynthesis.speak(utterance);
    }

    /**
     * 核心每秒 Tick 邏輯
     */
    function tick() {
      count++;
      const mantraText = formatToCantoneseMantra(count);

      // 1. 更新 UI
      const numElem = document.getElementById('number-display');
      const textElem = document.getElementById('cantonese-text');
      const beatInd = document.getElementById('beat-indicator');

      numElem.textContent = count;
      textElem.textContent = mantraText;

      numElem.classList.remove('beat-pulse');
      void numElem.offsetWidth; 
      numElem.classList.add('beat-pulse');

      beatInd.className = "absolute top-4 right-4 w-4 h-4 rounded-full bg-emerald-500 shadow-md shadow-emerald-500/50";
      setTimeout(() => {
        beatInd.className = "absolute top-4 right-4 w-4 h-4 rounded-full bg-slate-300 transition-colors duration-200";
      }, 200);

      // 2. 播放 Beep 聲
      if (document.getElementById('beep-toggle').checked) {
        playPrecisionBeep();
      }

      // 3. 播放廣東話語音
      if (document.getElementById('speech-toggle').checked) {
        speakCantoneseWord(mantraText);
      }
    }

    /**
     * 自適應動態計時迴圈
     */
    function step() {
      tick();

      expectedTickTime += 1000;
      const drift = Date.now() - expectedTickTime;
      const nextDelay = Math.max(0, 1000 - drift);

      timerId = setTimeout(step, nextDelay);
    }

    /**
     * 開始數數
     */
    function startCounting() {
      if (timerId !== null) return;

      // 關鍵修復：在使用者點擊按鈕的這一瞬間立即解鎖 iPad 音訊
      unlockIosAudio();

      // 同時喚醒語音引擎
      if ('speechSynthesis' in window) {
        const warmup = new SpeechSynthesisUtterance('');
        warmup.volume = 0;
        window.speechSynthesis.speak(warmup);
      }

      // 重置畫面狀態
      count = 0;
      document.getElementById('number-display').textContent = '0';
      document.getElementById('cantonese-text').textContent = '一零零零';

      const badge = document.getElementById('status-badge');
      badge.textContent = "⏱️ 計時進行中...";
      badge.className = "px-4 py-1.5 rounded-full text-sm font-bold bg-emerald-100 text-emerald-800 border border-emerald-300 animate-pulse shadow-sm";

      expectedTickTime = Date.now();
      timerId = setTimeout(step, 1000);
    }

    /**
     * 停止計時
     */
    function stopCounting() {
      if (timerId !== null) {
        clearTimeout(timerId);
        timerId = null;
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      const badge = document.getElementById('status-badge');
      if (count > 0) {
        badge.textContent = `⏸ 已鎖定於 ${count} 秒`;
        badge.className = "px-4 py-1.5 rounded-full text-sm font-bold bg-amber-100 text-amber-800 border border-amber-300 shadow-sm";
      } else {
        badge.textContent = "尚未開始";
        badge.className = "px-4 py-1.5 rounded-full text-sm font-bold bg-slate-100 text-slate-500 border border-slate-200 shadow-sm";
      }
    }
  </script>
</body>
</html>
